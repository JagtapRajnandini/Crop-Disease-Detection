{% extends "base.html" %}

{% block title %}Create Farmer Account — AgriScan AI{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-container">
        <h2 class="auth-title">🌱 Create Farmer Account</h2>
        <p class="auth-subtitle">Register your greenhouse or field to begin tracking foliar diseases and audits.</p>

        <form method="post" action="{{ url_for('register') }}">
            <div class="form-group">
                <label class="form-label" for="full_name">Full Name *</label>
                <input
                    type="text"
                    name="full_name"
                    id="full_name"
                    class="input-styled"
                    placeholder="e.g. Ramesh Patil"
                    required
                    autofocus
                />
            </div>

            <div class="form-group">
                <label class="form-label" for="farm_name">Farm / Greenhouse Name</label>
                <input
                    type="text"
                    name="farm_name"
                    id="farm_name"
                    class="input-styled"
                    placeholder="e.g. Green Valley Polyhouse Bed 4"
                />
            </div>

            <div class="form-group">
                <label class="form-label" for="location">District / Location</label>
                <input
                    type="text"
                    name="location"
                    id="location"
                    class="input-styled"
                    placeholder="e.g. Nashik, Maharashtra"
                />
            </div>

            <div class="form-group">
                <label class="form-label" for="username">Choose Username *</label>
                <input
                    type="text"
                    name="username"
                    id="username"
                    class="input-styled"
                    placeholder="Select a unique username"
                    required
                />
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Choose Password *</label>
                <input
                    type="password"
                    name="password"
                    id="password"
                    class="input-styled"
                    placeholder="Minimum 4 characters"
                    required
                />
            </div>

            <button type="submit" class="btn-primary-action" style="margin-top: 10px;">
                <span>Complete Registration & Sign In →</span>
            </button>
        </form>

        <div class="auth-footer-text">
            Already have an account? <a href="{{ url_for('login') }}">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
