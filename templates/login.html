{% extends "base.html" %}

{% block title %}Sign In — AgriScan AI{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-container">
        <h2 class="auth-title">🔐 Farmer Portal Sign In</h2>
        <p class="auth-subtitle">Access your private farm scan history and longitudinal outbreak trends.</p>

        <form method="post" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input
                    type="text"
                    name="username"
                    id="username"
                    class="input-styled"
                    placeholder="Enter your registered username"
                    required
                    autofocus
                />
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input
                    type="password"
                    name="password"
                    id="password"
                    class="input-styled"
                    placeholder="Enter your account password"
                    required
                />
            </div>

            <button type="submit" class="btn-primary-action" style="margin-top: 10px;">
                <span>Sign In to Portal →</span>
            </button>
        </form>

        <div class="auth-footer-text">
            Don't have a farmer account yet? <a href="{{ url_for('register') }}">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
